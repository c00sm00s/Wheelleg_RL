[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bctrainctl"
version = "0.2.0"
description = "CLI for submitting and managing Alibaba Cloud PAI DLC training jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.5,<0.24.0",
  "rich>=13.7.1",
  "pydantic>=2.8.2",
  "PyYAML>=6.0.1,<=6.0.2",
  "alibabacloud-pai-dlc20201203>=1.6.11",
  "alibabacloud-aiworkspace20210204>=8.1.0",
  "alibabacloud-tea-openapi>=0.4.3",
  "alibabacloud-credentials>=1.0.2",
  "oss2>=2.19.1",
  "pathspec>=0.12.1",
  "textual>=0.79.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bctrainctl = "bctrainctl.main:run"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:pathspec"]

[tool.setuptools.packages.find]
include = ["bctrainctl*"]
